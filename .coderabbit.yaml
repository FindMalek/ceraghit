# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  high_level_summary: true
  poem: false
  sequence_diagrams: false
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "packages/orpc/**"
      instructions: "oRPC routers. Check input validation, stock holds, that admin procedures use adminProcedure, and that payment status always comes from the gateway (settleOrder), never from the request."
    - path: "packages/ui/src/components/**"
      instructions: "Generated by the shadcn CLI. Only flag real bugs."
    - path: "apps/api/src/env.ts"
      instructions: "Environment guard. Live payment keys, R2 and demo seeding must stay impossible outside their environment."
    - path: "packages/sdk/src/proxy.ts"
      instructions: "Allowlists decide what each browser origin can reach. Flag anything that lets the web origin reach admin routes."
