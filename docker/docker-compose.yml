# Local development database: pnpm db:up
name: ceraghit
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ceraghit
      POSTGRES_PASSWORD: ceraghit
      POSTGRES_DB: ceraghit
    ports:
      - "5435:5432"
    volumes:
      - ceraghit-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceraghit -d ceraghit"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  ceraghit-pg:
