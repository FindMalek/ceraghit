# Local development database and mail catcher: pnpm db:up (mails at http://localhost:8025)
name: ceraghit
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ceraghit
      POSTGRES_PASSWORD: ceraghit
      POSTGRES_DB: ceraghit
    ports:
      - "5435:5432"
    volumes:
      - ceraghit-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceraghit -d ceraghit"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.33.1
    environment:
      MP_MAX_MESSAGES: 2000
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  ceraghit-pg:
