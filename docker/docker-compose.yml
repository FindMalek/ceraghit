# Local development database: pnpm db:up
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ceraghit
      POSTGRES_PASSWORD: ceraghit
      POSTGRES_DB: ceraghit
    ports:
      - "5435:5432"
    volumes:
      - ceraghit-pg:/var/lib/postgresql/data

volumes:
  ceraghit-pg:
