packages:
  - apps/*
  - packages/*
  - test/e2e
  - test/demo

onlyBuiltDependencies:
  - esbuild
  - sharp

overrides:
  "body-parser@<2.4.0": ">=2.4.0"
  # GHSA-96hv-2xvq-fx4p, reached through @trigger.dev/sdk > socket.io-client > ws.
  "ws@<8.21.0": ">=8.21.0"
  # One opentelemetry line for the whole workspace: @vercel/otel's peers would otherwise pull the 3.x SDKs beside the
  # 0.2xx one the api starts, and two logger providers would fight over the global.
  "@opentelemetry/api": 1.9.0
  "@opentelemetry/api-logs": 0.217.0
  "@opentelemetry/instrumentation": 0.217.0
  "@opentelemetry/resources": 2.6.0
  "@opentelemetry/sdk-logs": 0.217.0
  "@opentelemetry/sdk-metrics": 2.6.0
  "@opentelemetry/sdk-trace-base": 2.6.0
  "@opentelemetry/sdk-node": 0.217.0
  # JaegerPropagator DoS on a malformed header, patched in 2.9.0.
  "@opentelemetry/propagator-jaeger@<2.9.0": ">=2.9.0"
  # Reached through @opentelemetry/otlp-transformer; the 8.x advisories are patched in 8.4.1.
  "protobufjs@<8.4.1": ">=8.4.1"

