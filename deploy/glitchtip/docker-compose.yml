# GlitchTip (Sentry compatible error tracking) for the homelab / Dokploy. Not started by any script or workflow:
# the operator deploys it by hand, see docs/observability/glitchtip.md. Copy .env.example to .env next to this file.
# Image tags are pinned on purpose: bump them one at a time, read the GlitchTip release notes, run the migrate service.
name: ceraghit-glitchtip

x-glitchtip: &glitchtip
  image: glitchtip/glitchtip:6.2.6
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
  restart: unless-stopped
  environment:
    DATABASE_URL: postgres://glitchtip:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/glitchtip
    SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (50+ random characters)}
    GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:?set GLITCHTIP_DOMAIN, e.g. https://errors.example.com}
    DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?set DEFAULT_FROM_EMAIL}
    # SMTP for alert mails, e.g. smtps://user:password@smtp.example.com:465
    EMAIL_URL: ${EMAIL_URL:?set EMAIL_URL}
    # Redis protocol cache and queue (GlitchTip reads VALKEY_URL, REDIS_URL kept for older tags).
    VALKEY_URL: redis://redis:6379/0
    REDIS_URL: redis://redis:6379/0
    PORT: 8000
    # Invite-only: the operator creates the organization and users, nobody can sign up or open an organization.
    ENABLE_USER_REGISTRATION: "false"
    ENABLE_ORGANIZATION_CREATION: "false"
    # Events are kept 90 days, then pruned by the worker.
    GLITCHTIP_MAX_EVENT_LIFE_DAYS: "90"
  volumes:
    - uploads:/code/uploads

services:
  postgres:
    image: postgres:17.12-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: glitchtip
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip -d glitchtip"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  migrate:
    <<: *glitchtip
    command: ./bin/run-migrate.sh
    restart: "no"

  web:
    <<: *glitchtip
    ports:
      # Behind Traefik/Dokploy, drop this mapping and route the domain to port 8000 instead.
      - "127.0.0.1:${GLITCHTIP_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *glitchtip
    command: ./bin/run-celery-with-beat.sh
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  uploads:
