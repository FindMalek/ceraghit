# Everything an e2e job needs before it runs Playwright: toolchain, install, build, browsers.
# The caller checks the repository out first (a local action is read from the checkout).
name: e2e setup
description: Install, build and cache the Playwright browsers for an e2e job
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        dest: ${{ runner.temp }}/setup-pnpm
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.2
    - uses: actions/setup-node@v7
      with:
        node-version: "24"
    - run: pnpm install --frozen-lockfile
      shell: bash
    - run: pnpm build
      shell: bash
    - name: Read the Playwright version
      id: playwright
      shell: bash
      run: echo "version=$(node -p "require('./test/e2e/package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
    - name: Playwright browsers cache
      id: browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    - name: Install browsers
      if: steps.browsers.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm e2e:install
    - name: Install browser system dependencies
      if: steps.browsers.outputs.cache-hit == 'true'
      shell: bash
      run: pnpm --filter @workspace/e2e exec playwright install-deps chromium
