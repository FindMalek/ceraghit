# Keeps `ghcr.io/findmalek/ceraghit-<app>:main` fresh so PR previews can reuse the images of apps a PR does not change
# (see preview.yml). Builds only, never deploys. Skipped until vars.PREVIEW_ENABLED is "true", see docs/deploy.md.

name: Images main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: images-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: vars.PREVIEW_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app: [api, web, dashboard]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v4
      # The homelab buildkit sometimes drops its connection (EOF, graceful_stop): try again once with a fresh builder.
      - id: build
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/findmalek/ceraghit-${{ matrix.app }}:main
            ghcr.io/findmalek/ceraghit-${{ matrix.app }}:sha-${{ github.sha }}
          build-args: |
            TURBO_API=${{ vars.TURBO_API }}
            TURBO_TEAM=${{ vars.TURBO_TEAM }}
          secrets: |
            turbo_token=${{ secrets.TURBO_TOKEN }}
          cache-from: type=gha/${{ matrix.app }}
          cache-to: type=gha/${{ matrix.app }},mode=max,ignore-error=true
      - name: Retry the build
        if: steps.build.outcome == 'failure'
        uses: docker/setup-buildx-action@v4
      - name: Build again
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/findmalek/ceraghit-${{ matrix.app }}:main
            ghcr.io/findmalek/ceraghit-${{ matrix.app }}:sha-${{ github.sha }}
          build-args: |
            TURBO_API=${{ vars.TURBO_API }}
            TURBO_TEAM=${{ vars.TURBO_TEAM }}
          secrets: |
            turbo_token=${{ secrets.TURBO_TOKEN }}
          cache-from: type=gha/${{ matrix.app }}
          cache-to: type=gha/${{ matrix.app }},mode=max,ignore-error=true
