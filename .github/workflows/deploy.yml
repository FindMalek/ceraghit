# Production: every merge to main migrates Neon, then ships api, web and dashboard to Vercel from this workflow
# (`vercel build --prebuilt`, so Turborepo's remote cache applies and Vercel's own git previews stay off).
# Everything here runs in the `production` GitHub environment: its secrets exist nowhere else.
# Skipped until vars.DEPLOY_ENABLED is "true", see docs/deploy.md.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

env:
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  migrate:
    # Manual runs from another branch must not migrate Neon; deploy and smoke need this job, so they skip too.
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, the-keep]
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: pnpm install --frozen-lockfile --filter @workspace/db...
      # Re-checked here so nothing destructive reaches Neon even if the PR check was skipped; a failure stops the deploy too.
      - name: Migrations are additive
        env:
          ALLOW_DESTRUCTIVE: ${{ vars.ALLOW_DESTRUCTIVE_MIGRATION == 'true' }}
          BEFORE: ${{ github.event_name == 'push' && github.event.before || 'HEAD~1' }}
        run: node scripts/check-migrations.mjs --base "$BEFORE" --head "$GITHUB_SHA"
      - name: Apply migrations to Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun packages/db/src/migrate-cli.ts
      - name: Create or update the owner login
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          # Unset: an existing owner keeps the password they chose. Set the variable to 1 for one deploy to reset it.
          ADMIN_PASSWORD_ROTATE: ${{ vars.ADMIN_PASSWORD_ROTATE }}
        run: bun packages/db/src/admin-cli.ts

  deploy:
    needs: migrate
    runs-on: [self-hosted, the-keep]
    timeout-minutes: 20
    environment:
      name: production
      url: https://${{ vars.PRODUCTION_WEB_HOST }}
    strategy:
      max-parallel: 1
      matrix:
        include:
          - app: api
            project: VERCEL_PROJECT_ID_API
          - app: web
            project: VERCEL_PROJECT_ID_WEB
          - app: dashboard
            project: VERCEL_PROJECT_ID_DASHBOARD
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: pnpm install --frozen-lockfile
      - run: pnpm add -g vercel@65.9.0
      # Vercel looks for the function in api/ before it runs any build command, so the bundle must exist first.
      - name: Bundle the api
        if: matrix.app == 'api'
        run: pnpm --filter api run build:vercel
      # Plain (non-sensitive) variable, so `vercel env ls` shows the value; --force makes it idempotent. The token is read from VERCEL_TOKEN by the CLI.
      - name: Set TRUSTED_PROXY_HOPS on the api
        if: matrix.app == 'api'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project] || vars[matrix.project] }}
        run: |
          set -euo pipefail
          printf '1' | vercel env add TRUSTED_PROXY_HOPS --environment production --no-sensitive --force >/dev/null
          echo "TRUSTED_PROXY_HOPS=1 set on the production api"
      - name: Build and deploy ${{ matrix.app }}
        # Environment secrets only exist inside a job that uses the environment, so they are read here, not at the top.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project] || vars[matrix.project] }}
        # From the repo root: each Vercel project has its Root Directory set to apps/<app>, so monorepo files resolve.
        run: |
          vercel pull --yes --environment=production
          vercel build --prod
          vercel deploy --prebuilt --prod

  smoke:
    needs: deploy
    runs-on: [self-hosted, the-keep]
    timeout-minutes: 5
    environment: production
    steps:
      - name: api health
        run: |
          for i in 1 2 3 4 5 6; do
            out=$(curl -fsS "https://${{ vars.PRODUCTION_API_HOST }}/health") && {
              echo "$out"
              echo "$out" | grep -q '"env":"production"' || { echo "::error::api is not the production deploy"; exit 1; }
              if echo "$out" | grep -q '"onlinePayments":true'; then
                echo "$out" | grep -q '"payments":"konnect:live"' || { echo "::error::online payments are on without live keys"; exit 1; }
              fi
              exit 0
            }
            sleep 10
          done
          echo "::error::api did not become healthy"; exit 1
      - name: spoofed x-forwarded-for changes nothing
        run: |
          curl -fsS -H 'x-forwarded-for: 203.0.113.9, 198.51.100.7' -H 'x-ceraghit-client-ip: 203.0.113.9' \
            "https://${{ vars.PRODUCTION_API_HOST }}/health" | grep -q '"env":"production"' \
            || { echo "::error::api health broke with a spoofed x-forwarded-for"; exit 1; }
      - name: storefront and dashboard answer
        run: |
          curl -fsS -o /dev/null "https://${{ vars.PRODUCTION_WEB_HOST }}"
          curl -fsS -o /dev/null -w "%{http_code}\n" "https://${{ vars.PRODUCTION_DASHBOARD_HOST }}/login"
