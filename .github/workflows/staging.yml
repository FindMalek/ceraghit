# Permanent staging on the-keep (Dokploy): every merge to main builds the three images and redeploys them on fixed hosts
# with their own database. Demo payments, demo data, the dev bucket under `staging/`: never live keys, that is
# production on Vercel. Skipped until vars.PREVIEW_ENABLED is "true", see docs/deploy.md.

name: Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: vars.PREVIEW_ENABLED == 'true'
    runs-on: [self-hosted, the-keep]
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app: [api, web, dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/findmalek/ceraghit-${{ matrix.app }}:main
            ghcr.io/findmalek/ceraghit-${{ matrix.app }}:sha-${{ github.sha }}
          build-args: |
            TURBO_API=${{ vars.TURBO_API }}
            TURBO_TEAM=${{ vars.TURBO_TEAM }}
          secrets: |
            turbo_token=${{ secrets.TURBO_TOKEN }}
          cache-from: type=local,src=/opt/buildx-cache/${{ matrix.app }}
          cache-to: type=local,dest=/opt/buildx-cache/${{ matrix.app }},mode=max,ignore-error=true

  deploy:
    needs: build
    runs-on: [self-hosted, the-keep]
    timeout-minutes: 30
    environment:
      name: staging
      url: https://${{ vars.STAGING_WEB_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy staging
        env:
          IMAGE_TAG: sha-${{ github.sha }}
          DOKPLOY_URL: ${{ vars.DOKPLOY_PUBLIC_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN || github.token }}
          STAGING_WEB_HOST: ${{ vars.STAGING_WEB_HOST }}
          STAGING_DASHBOARD_HOST: ${{ vars.STAGING_DASHBOARD_HOST }}
          STAGING_API_HOST: ${{ vars.STAGING_API_HOST }}
          ADMIN_EMAIL: ${{ vars.STAGING_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          KONNECT_TEST_API_KEY: ${{ secrets.KONNECT_TEST_API_KEY }}
          KONNECT_TEST_WALLET_ID: ${{ secrets.KONNECT_TEST_WALLET_ID }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          PREVIEW_S3_BUCKET: ${{ vars.PREVIEW_S3_BUCKET }}
          PREVIEW_S3_ACCESS_KEY_ID: ${{ secrets.PREVIEW_S3_ACCESS_KEY_ID }}
          PREVIEW_S3_SECRET_ACCESS_KEY: ${{ secrets.PREVIEW_S3_SECRET_ACCESS_KEY }}
        run: node scripts/deploy/dokploy.mjs staging
