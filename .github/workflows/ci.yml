# Lint, types, tests and a full build on every PR and on main, in parallel jobs.
# Turborepo's remote cache (the-keep, turbo.findmalek.engineer) is used when TURBO_TOKEN is set, so a job whose
# inputs did not change finishes in seconds. Runs on the-keep runners (see docs/deploy.md).

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    runs-on: [self-hosted, the-keep]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: AI rules are in sync
        run: pnpm rules:check
      - name: Schema changes have a migration
        run: |
          pnpm db:generate
          git diff --exit-code -- packages/db/drizzle || { echo "::error::schema changed without a migration, run pnpm db:generate"; exit 1; }

  types:
    runs-on: [self-hosted, the-keep]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check-types

  test:
    runs-on: [self-hosted, the-keep]
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ceraghit
          POSTGRES_PASSWORD: ceraghit
          POSTGRES_DB: ceraghit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ceraghit" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ceraghit:ceraghit@localhost:5432/ceraghit_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    runs-on: [self-hosted, the-keep]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
