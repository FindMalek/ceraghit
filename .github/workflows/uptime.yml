# Watches production between deploys. Runs on GitHub-hosted runners, never the-keep, so the check does not depend on
# the homelab. One open issue per incident (`production down`), commented on every failing run and closed on recovery.
# Skipped until vars.DEPLOY_ENABLED is "true", see docs/deploy.md.

name: Uptime

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  API_HOST: ${{ vars.PRODUCTION_API_HOST }}
  WEB_HOST: ${{ vars.PRODUCTION_WEB_HOST }}
  DASHBOARD_HOST: ${{ vars.PRODUCTION_DASHBOARD_HOST }}

jobs:
  check:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Check the api health
        run: |
          out=$(curl -fsS "https://$API_HOST/health")
          echo "$out" | jq -e '.env == "production" and .db == true' >/dev/null
      - name: Check the storefront and the dashboard
        run: |
          curl -fsS -o /dev/null "https://$WEB_HOST/"
          curl -fsS -o /dev/null "https://$WEB_HOST/shop"
          curl -fsS -o /dev/null "https://$DASHBOARD_HOST/login"
      - name: Check the certificate expiry
        run: |
          for host in "$API_HOST" "$WEB_HOST" "$DASHBOARD_HOST"; do
            end=$(echo | openssl s_client -servername "$host" -connect "$host:443" 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2)
            days=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
            echo "$host expires in $days days"
            [ "$days" -gt 14 ]
          done
      - name: Report an incident
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "production down"' --json number --jq '.[0].number // ""')
          body="A production check failed on $(date -u +%Y-%m-%dT%H:%M:%SZ). See $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh label create incident --repo "$GITHUB_REPOSITORY" --color B60205 --description "Production incident" 2>/dev/null || true
            gh issue create --repo "$GITHUB_REPOSITORY" --title "production down" --label incident --body "$body"
          fi
      - name: Close the incident
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "production down"' --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Production is answering again on $(date -u +%Y-%m-%dT%H:%M:%SZ)."
          done
