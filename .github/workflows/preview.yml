# Vercel-style previews on the-keep (Dokploy): three images per PR, three Dokploy apps + a Postgres, a sticky PR
# comment with the links, and a GitHub deployment so the PR shows "View deployment". Previews never touch production:
# own database, own bucket, demo payments. Only same-repo PRs get one.
# Apps a PR does not change reuse the `main` image (images-main.yml keeps it fresh), retagged to `pr-<n>`.
# Skipped until vars.PREVIEW_ENABLED is "true", see docs/deploy.md.

name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pull-requests: write
  issues: write
  deployments: write

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN }}
  DOKPLOY_URL: ${{ vars.DOKPLOY_PUBLIC_URL }}
  DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  changes:
    if: github.event.action != 'closed' && vars.PREVIEW_ENABLED == 'true' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.affected.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Any failure here builds all three apps, so a broken diff never ships a stale image.
      - id: affected
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          all='["api","web","dashboard"]'
          base=$(git merge-base "origin/$BASE_REF" "$HEAD_SHA") || { echo "apps=$all" >> "$GITHUB_OUTPUT"; exit 0; }
          if git diff --name-only "$base" "$HEAD_SHA" | grep -Eq '^(pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json|package\.json|\.npmrc|\.dockerignore|apps/[^/]+/Dockerfile|\.github/workflows/preview\.yml)$'; then
            echo "apps=$all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          out=$(TURBO_SCM_BASE="$base" TURBO_SCM_HEAD="$HEAD_SHA" npx --yes turbo@2.11.9 ls --affected --output=json) || { echo "apps=$all" >> "$GITHUB_OUTPUT"; exit 0; }
          apps=$(printf '%s\n' "$out" | sed -n '/^{/,$p' | jq -c '[.packages.items[].name | select(. == "api" or . == "web" or . == "dashboard")]') || apps=$all
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: github.event.action != 'closed' && vars.PREVIEW_ENABLED == 'true' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: [self-hosted, the-keep]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [api, web, dashboard]
    steps:
      - uses: actions/checkout@v7
      - run: echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v4
      - id: reuse
        env:
          APP: ${{ matrix.app }}
          APPS: ${{ needs.changes.outputs.apps }}
        run: |
          image="ghcr.io/findmalek/ceraghit-$APP"
          if printf '%s' "$APPS" | jq -e --arg a "$APP" 'index($a)' >/dev/null; then
            echo "- $APP: built (changed by this PR)" >> "$GITHUB_STEP_SUMMARY"
          elif docker buildx imagetools inspect "$image:main" >/dev/null 2>&1 && docker buildx imagetools create -t "$image:pr-$PR_NUMBER" "$image:main"; then
            echo "reused=true" >> "$GITHUB_OUTPUT"
            echo "- $APP: reused \`:main\` as \`pr-$PR_NUMBER\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- $APP: built (no \`:main\` image, or the retag failed)" >> "$GITHUB_STEP_SUMMARY"
          fi
      # The homelab buildkit sometimes drops its connection (EOF, graceful_stop): try again once with a fresh builder.
      - id: build
        if: steps.reuse.outputs.reused != 'true'
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ghcr.io/findmalek/ceraghit-${{ matrix.app }}:pr-${{ env.PR_NUMBER }}
          build-args: |
            TURBO_API=${{ vars.TURBO_API }}
            TURBO_TEAM=${{ vars.TURBO_TEAM }}
          secrets: |
            turbo_token=${{ secrets.TURBO_TOKEN }}
          cache-from: type=local,src=/opt/buildx-cache/${{ matrix.app }}
          cache-to: type=local,dest=/opt/buildx-cache/${{ matrix.app }}-new,mode=max,ignore-error=true
      - name: Retry the build
        if: steps.reuse.outputs.reused != 'true' && steps.build.outcome == 'failure'
        uses: docker/setup-buildx-action@v4
      - name: Build again
        if: steps.reuse.outputs.reused != 'true' && steps.build.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ghcr.io/findmalek/ceraghit-${{ matrix.app }}:pr-${{ env.PR_NUMBER }}
          build-args: |
            TURBO_API=${{ vars.TURBO_API }}
            TURBO_TEAM=${{ vars.TURBO_TEAM }}
          secrets: |
            turbo_token=${{ secrets.TURBO_TOKEN }}
          cache-from: type=local,src=/opt/buildx-cache/${{ matrix.app }}
          cache-to: type=local,dest=/opt/buildx-cache/${{ matrix.app }}-new,mode=max,ignore-error=true
      # cache-to writes a fresh snapshot to `-new` instead of merging into the live dir, so this swap
      # keeps the cache capped at "what the latest build actually used" instead of growing forever
      # (the old shared static dest just accumulated every historical layer, unbounded).
      - name: Promote build cache
        if: steps.reuse.outputs.reused != 'true'
        run: |
          APP="${{ matrix.app }}"
          if [ -d "/opt/buildx-cache/$APP-new" ]; then
            rm -rf "/opt/buildx-cache/$APP"
            mv "/opt/buildx-cache/$APP-new" "/opt/buildx-cache/$APP"
          fi
      - name: Mark failed
        if: failure()
        run: node scripts/deploy/dokploy.mjs comment-failed

  deploy:
    needs: build
    runs-on: [self-hosted, the-keep]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Deploy preview
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          PREVIEW_DB_HOST: ${{ vars.PREVIEW_DB_HOST }}
          ADMIN_EMAIL: ${{ vars.PREVIEW_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.PREVIEW_ADMIN_PASSWORD }}
          MAIL_REDIRECT_TO: ${{ vars.PREVIEW_MAIL_REDIRECT_TO }}
          PREVIEW_MAILPIT_AUTH: ${{ secrets.PREVIEW_MAILPIT_AUTH }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          PREVIEW_S3_BUCKET: ${{ vars.PREVIEW_S3_BUCKET }}
          PREVIEW_S3_ACCESS_KEY_ID: ${{ secrets.PREVIEW_S3_ACCESS_KEY_ID }}
          PREVIEW_S3_SECRET_ACCESS_KEY: ${{ secrets.PREVIEW_S3_SECRET_ACCESS_KEY }}
          OPENOBSERVE_URL: ${{ vars.OPENOBSERVE_URL }}
          OPENOBSERVE_ORG: ${{ vars.OPENOBSERVE_ORG }}
          OPENOBSERVE_STREAM: ${{ vars.OPENOBSERVE_STREAM }}
          OPENOBSERVE_USER: ${{ secrets.OPENOBSERVE_USER }}
          OPENOBSERVE_PASSWORD: ${{ secrets.OPENOBSERVE_PASSWORD }}
        run: node scripts/deploy/dokploy.mjs preview-up
      - name: Mark failed
        if: failure()
        run: node scripts/deploy/dokploy.mjs comment-failed

  cleanup:
    if: github.event.action == 'closed' && vars.PREVIEW_ENABLED == 'true' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: [self-hosted, the-keep]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Delete preview apps and database
        run: node scripts/deploy/dokploy.mjs preview-down
      - name: Delete preview uploads
        env:
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          PREVIEW_S3_BUCKET: ${{ vars.PREVIEW_S3_BUCKET }}
          PREVIEW_S3_ACCESS_KEY_ID: ${{ secrets.PREVIEW_S3_ACCESS_KEY_ID }}
          PREVIEW_S3_SECRET_ACCESS_KEY: ${{ secrets.PREVIEW_S3_SECRET_ACCESS_KEY }}
        run: bun scripts/deploy/preview-storage-cleanup.ts
      # Don't wait on keep-tidy's 7-day-unused sweep: this PR's images are dead the moment it closes.
      - name: Delete this PR's local images
        run: |
          images=$(docker images --filter "reference=ghcr.io/findmalek/ceraghit-*:pr-${{ env.PR_NUMBER }}" -q)
          [ -n "$images" ] && docker rmi -f $images || true
