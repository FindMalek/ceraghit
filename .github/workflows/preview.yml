# Vercel-style previews on the-keep (Dokploy): three images per PR, three Dokploy apps + a Postgres, a sticky PR
# comment with the links, and a GitHub deployment so the PR shows "View deployment". Previews never touch production:
# own database, own bucket, demo payments or Konnect sandbox keys. Only same-repo PRs get one.
# Skipped until vars.PREVIEW_ENABLED is "true", see docs/deploy.md.

name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pull-requests: write
  issues: write
  deployments: write

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN }}
  DOKPLOY_URL: ${{ vars.DOKPLOY_PUBLIC_URL }}
  DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  build:
    if: github.event.action != 'closed' && vars.PREVIEW_ENABLED == 'true' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: [self-hosted, the-keep]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [api, web, dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ghcr.io/findmalek/ceraghit-${{ matrix.app }}:pr-${{ env.PR_NUMBER }}
          build-args: |
            TURBO_API=${{ vars.TURBO_API }}
            TURBO_TEAM=${{ vars.TURBO_TEAM }}
          secrets: |
            turbo_token=${{ secrets.TURBO_TOKEN }}
          cache-from: type=local,src=/opt/buildx-cache/${{ matrix.app }}
          cache-to: type=local,dest=/opt/buildx-cache/${{ matrix.app }},mode=max,ignore-error=true
      - name: Mark failed
        if: failure()
        run: node scripts/deploy/dokploy.mjs comment-failed

  deploy:
    needs: build
    runs-on: [self-hosted, the-keep]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Deploy preview
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN || github.token }}
          PREVIEW_DB_HOST: ${{ vars.PREVIEW_DB_HOST }}
          ADMIN_EMAIL: ${{ vars.PREVIEW_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.PREVIEW_ADMIN_PASSWORD }}
          KONNECT_TEST_API_KEY: ${{ secrets.KONNECT_TEST_API_KEY }}
          KONNECT_TEST_WALLET_ID: ${{ secrets.KONNECT_TEST_WALLET_ID }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          PREVIEW_S3_BUCKET: ${{ vars.PREVIEW_S3_BUCKET }}
          PREVIEW_S3_ACCESS_KEY_ID: ${{ secrets.PREVIEW_S3_ACCESS_KEY_ID }}
          PREVIEW_S3_SECRET_ACCESS_KEY: ${{ secrets.PREVIEW_S3_SECRET_ACCESS_KEY }}
        run: node scripts/deploy/dokploy.mjs preview-up
      - name: Mark failed
        if: failure()
        run: node scripts/deploy/dokploy.mjs comment-failed

  cleanup:
    if: github.event.action == 'closed' && vars.PREVIEW_ENABLED == 'true' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: [self-hosted, the-keep]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Delete preview apps and database
        run: node scripts/deploy/dokploy.mjs preview-down
      - name: Delete preview uploads
        env:
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          PREVIEW_S3_BUCKET: ${{ vars.PREVIEW_S3_BUCKET }}
          PREVIEW_S3_ACCESS_KEY_ID: ${{ secrets.PREVIEW_S3_ACCESS_KEY_ID }}
          PREVIEW_S3_SECRET_ACCESS_KEY: ${{ secrets.PREVIEW_S3_SECRET_ACCESS_KEY }}
        run: bun scripts/deploy/preview-storage-cleanup.ts
