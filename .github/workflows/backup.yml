# Weekly encrypted database dump + media sync to a separate R2 bucket. Production environment only, so the backup
# credentials are unreadable from previews. Skipped until vars.DEPLOY_ENABLED is "true", see docs/deploy.md.

name: Backup

on:
  schedule:
    - cron: "30 2 * * 0"
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Install the tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client age rclone

      - name: Dump and encrypt the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          mkdir -p backup/db
          file="backup/db/$(date -u +%Y-%m-%d).dump.age"
          pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges | age -r "$BACKUP_AGE_RECIPIENT" -o "$file"
          test -s "$file"

      - name: Upload the dump
        env:
          RCLONE_CONFIG_BACKUP_TYPE: s3
          RCLONE_CONFIG_BACKUP_PROVIDER: Cloudflare
          RCLONE_CONFIG_BACKUP_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          RCLONE_CONFIG_BACKUP_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BUCKET: ${{ vars.BACKUP_S3_BUCKET || 'ceraghit-backup' }}
        run: |
          file=$(ls backup/db/*.dump.age | head -1)
          rclone copyto "$file" "backup:$BUCKET/db/$(basename "$file")"

      - name: Sync the media, keeping deletions
        env:
          RCLONE_CONFIG_SOURCE_TYPE: s3
          RCLONE_CONFIG_SOURCE_PROVIDER: Cloudflare
          RCLONE_CONFIG_SOURCE_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          RCLONE_CONFIG_SOURCE_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_SOURCE_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_BACKUP_TYPE: s3
          RCLONE_CONFIG_BACKUP_PROVIDER: Cloudflare
          RCLONE_CONFIG_BACKUP_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          RCLONE_CONFIG_BACKUP_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          SOURCE_BUCKET: ${{ vars.S3_BUCKET || 'ceraghit-prod' }}
          BACKUP_BUCKET: ${{ vars.BACKUP_S3_BUCKET || 'ceraghit-backup' }}
        run: rclone sync "source:$SOURCE_BUCKET" "backup:$BACKUP_BUCKET/media" --backup-dir "backup:$BACKUP_BUCKET/media-deleted/$(date -u +%Y-%m-%d)"
